<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 500"
     width="100%"
     height="auto"
     role="img"
     aria-label="Keep building. Keep learning.">

  <defs>

    <!-- ============================== -->
    <!-- BACKGROUND -->
    <!-- ============================== -->

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%"
            stop-color="#07152B"/>

      <stop offset="50%"
            stop-color="#0D1117"/>

      <stop offset="100%"
            stop-color="#02040A"/>

    </linearGradient>


    <!-- ============================== -->
    <!-- NEON -->
    <!-- ============================== -->

    <linearGradient id="neon"
                    x1="0"
                    x2="1">

      <stop offset="0%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

      <stop offset="50%"
            stop-color="#58A6FF"
            stop-opacity=".95"/>

      <stop offset="100%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ============================== -->
    <!-- CENTER GLOW -->
    <!-- ============================== -->

    <radialGradient id="centerGlow">

      <stop offset="0%"
            stop-color="#1F6FEB"
            stop-opacity=".18"/>

      <stop offset="60%"
            stop-color="#1F6FEB"
            stop-opacity=".06"/>

      <stop offset="100%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ============================== -->
    <!-- GRID -->
    <!-- ============================== -->

    <pattern id="grid"
             width="50"
             height="50"
             patternUnits="userSpaceOnUse">

      <path
        d="M50 0H0V50"
        fill="none"
        stroke="#58A6FF"
        stroke-opacity=".045"
        stroke-width="1"/>

    </pattern>


    <!-- ============================== -->
    <!-- GLOW -->
    <!-- ============================== -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="6"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>


  <!-- ================================= -->
  <!-- BACKGROUND -->
  <!-- ================================= -->

  <rect
    width="1600"
    height="500"
    rx="30"
    fill="url(#bg)"/>


  <!-- GRID -->

  <rect
    width="1600"
    height="500"
    rx="30"
    fill="url(#grid)"/>


  <!-- ================================= -->
  <!-- CENTER GLOW -->
  <!-- ================================= -->

  <ellipse
    cx="800"
    cy="250"
    rx="650"
    ry="250"
    fill="url(#centerGlow)">

    <animate
      attributeName="opacity"
      values=".65;1;.65"
      dur="6s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ================================= -->
  <!-- TOP NEON HORIZON -->
  <!-- ================================= -->

  <rect
    x="0"
    y="105"
    width="1600"
    height="2"
    fill="url(#neon)"
    filter="url(#glow)">

    <animate
      attributeName="opacity"
      values=".35;1;.35"
      dur="2.8s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================= -->
  <!-- PARTICLES -->
  <!-- ================================= -->

  <g
    fill="#58A6FF"
    filter="url(#glow)">

    <circle
      cx="130"
      cy="80"
      r="2">

      <animate
        attributeName="cy"
        values="80;55;80"
        dur="4s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".25;1;.25"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="300"
      cy="390"
      r="2">

      <animate
        attributeName="cy"
        values="390;360;390"
        dur="5s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="1260"
      cy="75"
      r="2">

      <animate
        attributeName="cy"
        values="75;45;75"
        dur="4.4s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="1450"
      cy="380"
      r="2">

      <animate
        attributeName="cy"
        values="380;345;380"
        dur="5.2s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================= -->
  <!-- DECORATIVE LEFT -->
  <!-- ================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".18"
    stroke-width="1.5">

    <path d="M80 210 L210 155 L320 215"/>

  </g>

  <g fill="#58A6FF"
     opacity=".55">

    <circle cx="80" cy="210" r="3"/>
    <circle cx="210" cy="155" r="3"/>
    <circle cx="320" cy="215" r="3"/>

  </g>


  <!-- ================================= -->
  <!-- DECORATIVE RIGHT -->
  <!-- ================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".18"
    stroke-width="1.5">

    <path d="M1280 215 L1390 155 L1520 210"/>

  </g>

  <g fill="#58A6FF"
     opacity=".55">

    <circle cx="1280" cy="215" r="3"/>
    <circle cx="1390" cy="155" r="3"/>
    <circle cx="1520" cy="210" r="3"/>

  </g>


  <!-- ================================= -->
  <!-- HEADER -->
  <!-- ================================= -->

  <g
    font-family="monospace"
    text-anchor="middle">

    <text
      x="800"
      y="75"
      fill="#58A6FF"
      font-size="14"
      font-weight="600"
      letter-spacing="4">

      CONNECTION ESTABLISHED

    </text>


    <!-- ================================= -->
    <!-- MAIN MESSAGE -->
    <!-- ================================= -->

    <text
      x="800"
      y="175"
      fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="34"
      font-weight="800"
      letter-spacing="1">

      KEEP BUILDING. KEEP LEARNING.

    </text>


    <!-- ================================= -->
    <!-- SUBTITLE -->
    <!-- ================================= -->

    <text
      x="800"
      y="212"
      fill="#8B949E"
      font-size="15"
      letter-spacing="1">

      Every project is another iteration of the system.

    </text>

  </g>


  <!-- ================================= -->
  <!-- SYSTEM STATUS -->
  <!-- ================================= -->

  <g
    transform="translate(460 265)"
    font-family="monospace">

    <!-- Labels -->

    <text
      x="0"
      y="0"
      fill="#8B949E"
      font-size="12">

      SYSTEM

    </text>


    <text
      x="680"
      y="0"
      text-anchor="end"
      fill="#27C93F"
      font-size="12">

      ● ONLINE

    </text>


    <!-- Track -->

    <rect
      x="0"
      y="18"
      width="680"
      height="8"
      rx="4"
      fill="#161B22"/>


    <!-- Progress -->

    <rect
      x="0"
      y="18"
      width="600"
      height="8"
      rx="4"
      fill="#1F6FEB">

      <animate
        attributeName="width"
        values="520;660;520"
        dur="4s"
        repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ================================= -->
  <!-- TECH STACK -->
  <!-- ================================= -->

  <text
    x="800"
    y="365"
    text-anchor="middle"
    fill="#58A6FF"
    font-family="monospace"
    font-size="13"
    letter-spacing="1">

    [ WEB ]   [ MOBILE ]   [ BACKEND ]   [ CLOUD ]   [ IoT ]

  </text>


  <!-- ================================= -->
  <!-- DIVIDER -->
  <!-- ================================= -->

  <line
    x1="540"
    y1="395"
    x2="1060"
    y2="395"
    stroke="url(#neon)"
    stroke-width="1"
    opacity=".65"/>


  <!-- ================================= -->
  <!-- FOOTER -->
  <!-- ================================= -->

  <text
    x="800"
    y="430"
    text-anchor="middle"
    fill="#69727D"
    font-family="monospace"
    font-size="11"
    letter-spacing="2">

    END OF PROFILE // 2026 // MAINGGA

  </text>


  <!-- ================================= -->
  <!-- CORNER DETAILS -->
  <!-- ================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".25"
    stroke-width="1">

    <!-- Top left -->

    <path d="M40 70 H110"/>
    <path d="M40 70 V125"/>


    <!-- Top right -->

    <path d="M1490 70 H1560"/>
    <path d="M1560 70 V125"/>


    <!-- Bottom left -->

    <path d="M40 430 H110"/>
    <path d="M40 375 V430"/>


    <!-- Bottom right -->

    <path d="M1490 430 H1560"/>
    <path d="M1560 375 V430"/>

  </g>


  <!-- ================================= -->
  <!-- SMALL SYSTEM MARKERS -->
  <!-- ================================= -->

  <g
    font-family="monospace"
    font-size="9"
    fill="#58A6FF"
    opacity=".35">

    <text x="65" y="150">
      NODE_01
    </text>

    <text x="65" y="165">
      ACTIVE
    </text>


    <text x="1450" y="150">
      SYS_02
    </text>

    <text x="1450" y="165">
      ONLINE
    </text>

  </g>

</svg>
