<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 500"
     width="100%"
     height="auto"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="Keep building. Keep learning.">

  <defs>

    <!-- ========================================= -->
    <!-- BACKGROUND -->
    <!-- ========================================= -->

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="48%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#071A32"/>

    </linearGradient>


    <!-- ========================================= -->
    <!-- CENTER GLOW -->
    <!-- ========================================= -->

    <radialGradient id="centerGlow">

      <stop offset="0%"
            stop-color="#1F6FEB"
            stop-opacity=".28"/>

      <stop offset="45%"
            stop-color="#1F6FEB"
            stop-opacity=".10"/>

      <stop offset="100%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ========================================= -->
    <!-- GRID -->
    <!-- ========================================= -->

    <pattern id="grid"
             width="50"
             height="50"
             patternUnits="userSpaceOnUse">

      <path
        d="M50 0H0V50"
        fill="none"
        stroke="#58A6FF"
        stroke-opacity=".045"
        stroke-width="1"/>

    </pattern>


    <!-- ========================================= -->
    <!-- NEON GRADIENT -->
    <!-- ========================================= -->

    <linearGradient id="neon"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

      <stop offset="30%"
            stop-color="#1F6FEB"
            stop-opacity=".3"/>

      <stop offset="50%"
            stop-color="#79C0FF"
            stop-opacity="1"/>

      <stop offset="70%"
            stop-color="#1F6FEB"
            stop-opacity=".3"/>

      <stop offset="100%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ========================================= -->
    <!-- ENERGY -->
    <!-- ========================================= -->

    <linearGradient id="energy"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#58A6FF"
            stop-opacity="0"/>

      <stop offset="40%"
            stop-color="#58A6FF"
            stop-opacity=".1"/>

      <stop offset="50%"
            stop-color="#FFFFFF"
            stop-opacity="1"/>

      <stop offset="60%"
            stop-color="#58A6FF"
            stop-opacity=".1"/>

      <stop offset="100%"
            stop-color="#58A6FF"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ========================================= -->
    <!-- GLOW -->
    <!-- ========================================= -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ========================================= -->
    <!-- STRONG GLOW -->
    <!-- ========================================= -->

    <filter id="strongGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="10"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ========================================= -->
    <!-- CLIP -->
    <!-- ========================================= -->

    <clipPath id="clip">

      <rect
        x="0"
        y="0"
        width="1600"
        height="500"
        rx="30"/>

    </clipPath>

  </defs>


  <!-- ========================================= -->
  <!-- MAIN -->
  <!-- ========================================= -->

  <g clip-path="url(#clip)">

    <!-- Background -->

    <rect
      width="1600"
      height="500"
      fill="url(#bg)"/>


    <!-- Grid -->

    <rect
      width="1600"
      height="500"
      fill="url(#grid)"/>


    <!-- ======================================= -->
    <!-- CENTER AMBIENT GLOW -->
    <!-- ======================================= -->

    <ellipse
      cx="800"
      cy="250"
      rx="680"
      ry="280"
      fill="url(#centerGlow)"
      filter="url(#strongGlow)">

      <animate
        attributeName="opacity"
        values=".45;1;.45"
        dur="6s"
        repeatCount="indefinite"/>

    </ellipse>


    <!-- ======================================= -->
    <!-- MOVING SCAN LINE -->
    <!-- ======================================= -->

    <rect
      x="-10"
      y="0"
      width="3"
      height="500"
      fill="#58A6FF"
      opacity=".12"
      filter="url(#glow)">

      <animate
        attributeName="x"
        values="-10;1610"
        dur="7s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ======================================= -->
    <!-- TOP ENERGY LINE -->
    <!-- ======================================= -->

    <rect
      x="0"
      y="105"
      width="1600"
      height="2"
      fill="url(#neon)"
      filter="url(#glow)">

      <animate
        attributeName="opacity"
        values=".25;1;.25"
        dur="3s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ======================================= -->
    <!-- MOVING ENERGY BEAM -->
    <!-- ======================================= -->

    <rect
      x="-300"
      y="95"
      width="260"
      height="22"
      fill="url(#energy)"
      opacity=".8"
      filter="url(#glow)">

      <animate
        attributeName="x"
        values="-300;1600"
        dur="4s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ======================================= -->
    <!-- PARTICLES -->
    <!-- ======================================= -->

    <g fill="#79C0FF"
       filter="url(#glow)">

      <circle cx="130" cy="80" r="2">

        <animate
          attributeName="cy"
          values="80;55;80"
          dur="4s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values=".15;1;.15"
          dur="2.5s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="300" cy="390" r="2">

        <animate
          attributeName="cy"
          values="390;360;390"
          dur="5s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values=".2;1;.2"
          dur="3s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="1260" cy="75" r="2">

        <animate
          attributeName="cy"
          values="75;45;75"
          dur="4.5s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="1450" cy="380" r="2">

        <animate
          attributeName="cy"
          values="380;345;380"
          dur="5.2s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="420" cy="120" r="1.5">

        <animate
          attributeName="opacity"
          values=".1;1;.1"
          dur="2.2s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="1180" cy="420" r="1.5">

        <animate
          attributeName="opacity"
          values="1;.1;1"
          dur="2.8s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ======================================= -->
    <!-- LEFT CONSTELLATION -->
    <!-- ======================================= -->

    <g fill="none"
       stroke="#58A6FF"
       stroke-opacity=".18"
       stroke-width="1.5">

      <path d="M80 210 L210 155 L320 215"/>

    </g>


    <g fill="#58A6FF">

      <circle cx="80" cy="210" r="3">
        <animate
          attributeName="r"
          values="2;5;2"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="210" cy="155" r="3"/>

      <circle cx="320" cy="215" r="3">
        <animate
          attributeName="opacity"
          values=".3;1;.3"
          dur="2.5s"
          repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- ======================================= -->
    <!-- RIGHT CONSTELLATION -->
    <!-- ======================================= -->

    <g fill="none"
       stroke="#58A6FF"
       stroke-opacity=".18"
       stroke-width="1.5">

      <path d="M1280 215 L1390 155 L1520 210"/>

    </g>


    <g fill="#58A6FF">

      <circle cx="1280" cy="215" r="3">
        <animate
          attributeName="opacity"
          values=".3;1;.3"
          dur="2.4s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="1390" cy="155" r="3"/>

      <circle cx="1520" cy="210" r="3">
        <animate
          attributeName="r"
          values="2;5;2"
          dur="2.2s"
          repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- ======================================= -->
    <!-- HEADER -->
    <!-- ======================================= -->

    <g font-family="monospace"
       text-anchor="middle">

      <text
        x="800"
        y="75"
        fill="#58A6FF"
        font-size="14"
        font-weight="600"
        letter-spacing="4">

        CONNECTION ESTABLISHED

        <animate
          attributeName="opacity"
          values=".5;1;.5"
          dur="2.5s"
          repeatCount="indefinite"/>

      </text>


      <!-- ===================================== -->
      <!-- MAIN MESSAGE -->
      <!-- ===================================== -->

      <text
        x="800"
        y="175"
        fill="#FFFFFF"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="1">

        KEEP BUILDING. KEEP LEARNING.

      </text>


      <!-- ===================================== -->
      <!-- GLOW TEXT -->
      <!-- ===================================== -->

      <text
        x="800"
        y="175"
        fill="none"
        stroke="#58A6FF"
        stroke-width=".5"
        opacity=".35"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="1"
        filter="url(#glow)">

        KEEP BUILDING. KEEP LEARNING.

      </text>


      <!-- ===================================== -->
      <!-- CURSOR -->
      <!-- ===================================== -->

      <rect
        x="1082"
        y="146"
        width="7"
        height="34"
        rx="1"
        fill="#58A6FF"
        filter="url(#glow)">

        <animate
          attributeName="opacity"
          values="1;0;1"
          dur="0.9s"
          repeatCount="indefinite"/>

      </rect>


      <!-- ===================================== -->
      <!-- SUBTITLE -->
      <!-- ===================================== -->

      <text
        x="800"
        y="212"
        fill="#8B949E"
        font-size="15"
        letter-spacing="1">

        Every project is another iteration of the system.

        <animate
          attributeName="opacity"
          values=".45;1;.45"
          dur="4s"
          repeatCount="indefinite"/>

      </text>

    </g>


    <!-- ======================================= -->
    <!-- SYSTEM STATUS -->
    <!-- ======================================= -->

    <g
      transform="translate(460 265)"
      font-family="monospace">

      <text
        x="0"
        y="0"
        fill="#8B949E"
        font-size="12">

        SYSTEM

      </text>


      <text
        x="680"
        y="0"
        text-anchor="end"
        fill="#27C93F"
        font-size="12">

        ● ONLINE

        <animate
          attributeName="opacity"
          values=".3;1;.3"
          dur="1.5s"
          repeatCount="indefinite"/>

      </text>


      <!-- TRACK -->

      <rect
        x="0"
        y="18"
        width="680"
        height="8"
        rx="4"
        fill="#161B22"/>


      <!-- PROGRESS -->

      <rect
        x="0"
        y="18"
        width="600"
        height="8"
        rx="4"
        fill="url(#neon)"
        filter="url(#glow)">

        <animate
          attributeName="width"
          values="480;660;520;640;480"
          dur="5s"
          repeatCount="indefinite"/>

      </rect>

    </g>


    <!-- ======================================= -->
    <!-- TECH STACK -->
    <!-- ======================================= -->

    <text
      x="800"
      y="365"
      text-anchor="middle"
      fill="#58A6FF"
      font-family="monospace"
      font-size="13"
      letter-spacing="1">

      [ WEB ]   [ MOBILE ]   [ BACKEND ]   [ CLOUD ]   [ IoT ]

      <animate
        attributeName="opacity"
        values=".45;1;.45"
        dur="3s"
        repeatCount="indefinite"/>

    </text>


    <!-- ======================================= -->
    <!-- DATA STREAM -->
    <!-- ======================================= -->

    <g font-family="monospace"
       font-size="10"
       fill="#58A6FF"
       opacity=".35">

      <text x="100" y="330">
        01001
      </text>

      <text x="1450" y="330">
        10110
      </text>

      <text x="120" y="350">
        11001
      </text>

      <text x="1430" y="350">
        00101
      </text>

      <text x="190" y="430">
        SYS_01
      </text>

      <text x="1370" y="430">
        NODE_02
      </text>

    </g>


    <!-- ======================================= -->
    <!-- DIVIDER -->
    <!-- ======================================= -->

    <line
      x1="540"
      y1="395"
      x2="1060"
      y2="395"
      stroke="url(#neon)"
      stroke-width="1"
      opacity=".7"/>


    <!-- ======================================= -->
    <!-- TRAVELING PARTICLE ON DIVIDER -->
    <!-- ======================================= -->

    <circle
      cx="540"
      cy="395"
      r="3"
      fill="#FFFFFF"
      filter="url(#glow)">

      <animate
        attributeName="cx"
        values="540;1060;540"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>


    <!-- ======================================= -->
    <!-- FOOTER MESSAGE -->
    <!-- ======================================= -->

    <text
      x="800"
      y="430"
      text-anchor="middle"
      fill="#69727D"
      font-family="monospace"
      font-size="11"
      letter-spacing="2">

      BUILD • LEARN • SHIP • IMPROVE

      <animate
        attributeName="opacity"
        values=".35;1;.35"
        dur="3.5s"
        repeatCount="indefinite"/>

    </text>


    <!-- ======================================= -->
    <!-- CORNER DETAILS -->
    <!-- ======================================= -->

    <g
      fill="none"
      stroke="#58A6FF"
      stroke-opacity=".25"
      stroke-width="1">

      <path d="M40 70 H110"/>
      <path d="M40 70 V125"/>

      <path d="M1490 70 H1560"/>
      <path d="M1560 70 V125"/>

      <path d="M40 430 H110"/>
      <path d="M40 375 V430"/>

      <path d="M1490 430 H1560"/>
      <path d="M1560 375 V430"/>

    </g>


    <!-- ======================================= -->
    <!-- CORNER PULSES -->
    <!-- ======================================= -->

    <circle
      cx="40"
      cy="70"
      r="4"
      fill="#58A6FF"
      filter="url(#glow)">

      <animate
        attributeName="r"
        values="2;7;2"
        dur="2s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="1560"
      cy="70"
      r="4"
      fill="#58A6FF"
      filter="url(#glow)">

      <animate
        attributeName="r"
        values="2;7;2"
        dur="2.3s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.3s"
        repeatCount="indefinite"/>

    </circle>


    <!-- ======================================= -->
    <!-- SYSTEM MARKERS -->
    <!-- ======================================= -->

    <g
      font-family="monospace"
      font-size="9"
      fill="#58A6FF"
      opacity=".4">

      <text x="65" y="150">
        NODE_01
      </text>

      <text x="65" y="165">
        ACTIVE
      </text>


      <text x="1450" y="150">
        SYS_02
      </text>

      <text x="1450" y="165">
        ONLINE
      </text>

    </g>

  </g>

</svg>
