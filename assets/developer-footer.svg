<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152B"/><stop offset=".5" stop-color="#0D1117"/><stop offset="1" stop-color="#02040A"/></linearGradient>
 <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#1F6FEB" stop-opacity="0"/><stop offset=".5" stop-color="#58A6FF"/><stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#58A6FF" stroke-opacity=".045"/></pattern>
</defs>
<rect width="1600" height="360" rx="30" fill="url(#bg)"/>
<rect width="1600" height="360" rx="30" fill="url(#grid)"/>

<!-- animated neon horizon -->
<rect x="0" y="95" width="1600" height="2" fill="url(#neon)" filter="url(#glow)">
 <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/>
</rect>

<!-- particles -->
<g fill="#58A6FF">
 <circle cx="150" cy="70" r="2"><animate attributeName="cy" values="70;45;70" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="350" cy="280" r="2"><animate attributeName="cy" values="280;250;280" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="1240" cy="65" r="2"><animate attributeName="cy" values="65;40;65" dur="4.4s" repeatCount="indefinite"/></circle>
 <circle cx="1420" cy="270" r="2"><animate attributeName="cy" values="270;235;270" dur="5.2s" repeatCount="indefinite"/></circle>
</g>

<g font-family="monospace" text-anchor="middle">
 <text x="800" y="65" fill="#58A6FF" font-size="13" letter-spacing="5">CONNECTION ESTABLISHED</text>
 <text x="800" y="145" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">KEEP BUILDING. KEEP LEARNING.</text>
 <text x="800" y="180" fill="#8B949E" font-size="14">Every project is another iteration of the system.</text>
</g>

<!-- progress -->
<g transform="translate(500 220)" font-family="monospace" font-size="12">
 <text x="0" y="0" fill="#8B949E">SYSTEM</text>
 <text x="600" y="0" text-anchor="end" fill="#27C93F">ONLINE</text>
 <rect y="16" width="600" height="8" rx="4" fill="#161B22"/>
 <rect y="16" width="600" height="8" rx="4" fill="#1F6FEB">
  <animate attributeName="width" values="470;590;470" dur="4s" repeatCount="indefinite"/>
 </rect>
</g>

<text x="800" y="295" text-anchor="middle" fill="#58A6FF" font-family="monospace" font-size="12">[ WEB ]  [ MOBILE ]  [ BACKEND ]  [ CLOUD ]  [ IoT ]</text>
<text x="800" y="325" text-anchor="middle" fill="#484F58" font-family="monospace" font-size="11">END OF PROFILE // 2026 // MAINGGA</text>
</svg>