<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 500"
     width="100%"
     height="auto"
     role="img"
     aria-label="Keep building. Keep learning.">

  <defs>

    <!-- ================================= -->
    <!-- BACKGROUND -->
    <!-- ================================= -->

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="45%" stop-color="#0B111A"/>
      <stop offset="100%" stop-color="#071A32"/>

    </linearGradient>


    <!-- ================================= -->
    <!-- NEON -->
    <!-- ================================= -->

    <linearGradient id="neon"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="35%" stop-color="#1F6FEB" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#79C0FF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#1F6FEB" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>

    </linearGradient>


    <!-- ================================= -->
    <!-- TEXT GRADIENT -->
    <!-- ================================= -->

    <linearGradient id="textGradient"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#58A6FF"/>

    </linearGradient>


    <!-- ================================= -->
    <!-- CENTER GLOW -->
    <!-- ================================= -->

    <radialGradient id="centerGlow">

      <stop offset="0%"
            stop-color="#1F6FEB"
            stop-opacity=".24"/>

      <stop offset="45%"
            stop-color="#1F6FEB"
            stop-opacity=".08"/>

      <stop offset="100%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ================================= -->
    <!-- SCAN BEAM -->
    <!-- ================================= -->

    <linearGradient id="scan"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#58A6FF"
            stop-opacity="0"/>

      <stop offset="50%"
            stop-color="#FFFFFF"
            stop-opacity=".8"/>

      <stop offset="100%"
            stop-color="#58A6FF"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ================================= -->
    <!-- GRID -->
    <!-- ================================= -->

    <pattern id="grid"
             width="50"
             height="50"
             patternUnits="userSpaceOnUse">

      <path
        d="M50 0H0V50"
        fill="none"
        stroke="#58A6FF"
        stroke-opacity=".045"
        stroke-width="1"/>

    </pattern>


    <!-- ================================= -->
    <!-- GLOW -->
    <!-- ================================= -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ================================= -->
    <!-- STRONG GLOW -->
    <!-- ================================= -->

    <filter id="strongGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="9"
        result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- ================================= -->
    <!-- CLIP -->
    <!-- ================================= -->

    <clipPath id="clip">

      <rect
        x="0"
        y="0"
        width="1600"
        height="500"
        rx="30"/>

    </clipPath>

  </defs>


  <!-- ================================= -->
  <!-- MAIN CONTAINER -->
  <!-- ================================= -->

  <g clip-path="url(#clip)">


    <!-- ================================= -->
    <!-- BACKGROUND -->
    <!-- ================================= -->

    <rect
      width="1600"
      height="500"
      fill="url(#bg)"/>


    <!-- GRID -->

    <rect
      width="1600"
      height="500"
      fill="url(#grid)"/>


    <!-- ================================= -->
    <!-- CENTER GLOW -->
    <!-- ================================= -->

    <ellipse
      cx="800"
      cy="250"
      rx="680"
      ry="300"
      fill="url(#centerGlow)"
      filter="url(#glow)">

      <animate
        attributeName="opacity"
        values=".55;1;.55"
        dur="5s"
        repeatCount="indefinite"/>

    </ellipse>


    <!-- ================================= -->
    <!-- GLOBAL SCAN -->
    <!-- ================================= -->

    <rect
      x="-300"
      y="0"
      width="220"
      height="500"
      fill="url(#scan)"
      opacity=".06">

      <animate
        attributeName="x"
        values="-300;1600"
        dur="7s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ================================= -->
    <!-- TOP ENERGY LINE -->
    <!-- ================================= -->

    <rect
      x="0"
      y="105"
      width="1600"
      height="2"
      fill="url(#neon)"
      filter="url(#glow)">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.5s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ================================= -->
    <!-- MOVING ENERGY PARTICLE -->
    <!-- ================================= -->

    <circle
      cx="0"
      cy="105"
      r="3"
      fill="#FFFFFF"
      filter="url(#strongGlow)">

      <animate
        attributeName="cx"
        values="0;1600"
        dur="4s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="0;1;1;0"
        dur="4s"
        repeatCount="indefinite"/>

    </circle>


    <!-- ================================= -->
    <!-- FLOATING PARTICLES -->
    <!-- ================================= -->

    <g
      fill="#79C0FF"
      filter="url(#glow)">


      <circle cx="130" cy="80" r="2">

        <animate
          attributeName="cy"
          values="80;55;80"
          dur="4s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values=".15;1;.15"
          dur="3s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="300" cy="390" r="2">

        <animate
          attributeName="cy"
          values="390;355;390"
          dur="5s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values=".2;.8;.2"
          dur="4s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="1260" cy="75" r="2">

        <animate
          attributeName="cy"
          values="75;45;75"
          dur="4.5s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="1450" cy="380" r="2">

        <animate
          attributeName="cy"
          values="380;345;380"
          dur="5.2s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="500" cy="70" r="1.5">

        <animate
          attributeName="opacity"
          values=".1;1;.1"
          dur="2s"
          repeatCount="indefinite"/>

      </circle>


      <circle cx="1100" cy="430" r="1.5">

        <animate
          attributeName="opacity"
          values="1;.1;1"
          dur="2.8s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================= -->
    <!-- LEFT CONSTELLATION -->
    <!-- ================================= -->

    <g
      fill="none"
      stroke="#58A6FF"
      stroke-opacity=".18"
      stroke-width="1.5">

      <path d="M80 210 L210 155 L320 215"/>

    </g>


    <g fill="#58A6FF">

      <circle cx="80" cy="210" r="3">
        <animate
          attributeName="r"
          values="3;6;3"
          dur="2s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="210" cy="155" r="3">
        <animate
          attributeName="opacity"
          values=".3;1;.3"
          dur="1.7s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="320" cy="215" r="3">
        <animate
          attributeName="r"
          values="3;5;3"
          dur="2.3s"
          repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- ================================= -->
    <!-- RIGHT CONSTELLATION -->
    <!-- ================================= -->

    <g
      fill="none"
      stroke="#58A6FF"
      stroke-opacity=".18"
      stroke-width="1.5">

      <path d="M1280 215 L1390 155 L1520 210"/>

    </g>


    <g fill="#58A6FF">

      <circle cx="1280" cy="215" r="3">
        <animate
          attributeName="r"
          values="3;6;3"
          dur="2.2s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="1390" cy="155" r="3">
        <animate
          attributeName="opacity"
          values=".3;1;.3"
          dur="1.8s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="1520" cy="210" r="3">
        <animate
          attributeName="r"
          values="3;5;3"
          dur="2.4s"
          repeatCount="indefinite"/>
      </circle>

    </g>


    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <g
      font-family="monospace"
      text-anchor="middle">


      <!-- SYSTEM -->

      <text
        x="800"
        y="75"
        fill="#58A6FF"
        font-size="14"
        font-weight="600"
        letter-spacing="4">

        CONNECTION ESTABLISHED

        <animate
          attributeName="opacity"
          values=".45;1;.45"
          dur="2.5s"
          repeatCount="indefinite"/>

      </text>


      <!-- ================================= -->
      <!-- MAIN MESSAGE -->
      <!-- ================================= -->

      <text
        x="800"
        y="175"
        fill="url(#textGradient)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="800"
        letter-spacing="1">

        KEEP BUILDING. KEEP LEARNING.

        <animate
          attributeName="opacity"
          values="0;0;1;1"
          dur="2s"
          repeatCount="indefinite"/>

      </text>


      <!-- ================================= -->
      <!-- TYPING CURSOR -->
      <!-- ================================= -->

      <rect
        x="1118"
        y="148"
        width="4"
        height="34"
        rx="1"
        fill="#58A6FF"
        filter="url(#glow)">

        <animate
          attributeName="opacity"
          values="1;0;1"
          dur="0.9s"
          repeatCount="indefinite"/>

      </rect>


      <!-- ================================= -->
      <!-- SUBTITLE -->
      <!-- ================================= -->

      <text
        x="800"
        y="212"
        fill="#8B949E"
        font-size="15"
        letter-spacing="1">

        Every project is another iteration of the system.

        <animate
          attributeName="opacity"
          values="0;0;1"
          dur="3s"
          repeatCount="indefinite"/>

      </text>

    </g>


    <!-- ================================= -->
    <!-- SYSTEM STATUS -->
    <!-- ================================= -->

    <g
      transform="translate(460 265)"
      font-family="monospace">


      <text
        x="0"
        y="0"
        fill="#8B949E"
        font-size="12">

        SYSTEM

      </text>


      <!-- ONLINE -->

      <text
        x="680"
        y="0"
        text-anchor="end"
        fill="#27C93F"
        font-size="12">

        ● ONLINE

        <animate
          attributeName="opacity"
          values=".35;1;.35"
          dur="1.6s"
          repeatCount="indefinite"/>

      </text>


      <!-- TRACK -->

      <rect
        x="0"
        y="18"
        width="680"
        height="8"
        rx="4"
        fill="#161B22"/>


      <!-- PROGRESS -->

      <rect
        x="0"
        y="18"
        width="560"
        height="8"
        rx="4"
        fill="url(#neon)"
        filter="url(#glow)">

        <animate
          attributeName="width"
          values="380;660;500;640;380"
          dur="5s"
          repeatCount="indefinite"/>

      </rect>


      <!-- MOVING DOT -->

      <circle
        cx="380"
        cy="22"
        r="4"
        fill="#FFFFFF"
        filter="url(#glow)">

        <animate
          attributeName="cx"
          values="380;660;500;640;380"
          dur="5s"
          repeatCount="indefinite"/>

      </circle>

    </g>


    <!-- ================================= -->
    <!-- TECH STACK -->
    <!-- ================================= -->

    <text
      x="800"
      y="365"
      text-anchor="middle"
      fill="#58A6FF"
      font-family="monospace"
      font-size="13"
      letter-spacing="1">

      [ WEB ]   [ MOBILE ]   [ BACKEND ]   [ CLOUD ]   [ IoT ]

      <animate
        attributeName="opacity"
        values=".45;1;.45"
        dur="3s"
        repeatCount="indefinite"/>

    </text>


    <!-- ================================= -->
    <!-- TECH SIGNAL -->
    <!-- ================================= -->

    <g
      font-family="monospace"
      font-size="9"
      fill="#58A6FF"
      opacity=".35">


      <text x="65" y="150">
        NODE_01
      </text>

      <text x="65" y="165">
        ACTIVE
      </text>


      <text x="1450" y="150">
        SYS_02
      </text>

      <text x="1450" y="165">
        ONLINE
      </text>

    </g>


    <!-- ================================= -->
    <!-- DIVIDER -->
    <!-- ================================= -->

    <line
      x1="540"
      y1="395"
      x2="1060"
      y2="395"
      stroke="#21262D"
      stroke-width="1"/>


    <rect
      x="540"
      y="394"
      width="80"
      height="2"
      fill="url(#neon)"
      filter="url(#glow)">

      <animate
        attributeName="x"
        values="540;980;540"
        dur="3.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="width"
        values="80;180;80"
        dur="3.5s"
        repeatCount="indefinite"/>

    </rect>


    <!-- ================================= -->
    <!-- FOOTER -->
    <!-- ================================= -->

    <text
      x="800"
      y="430"
      text-anchor="middle"
      fill="#69727D"
      font-family="monospace"
      font-size="11"
      letter-spacing="2">

      END OF PROFILE // 2026 // MAINGGA

    </text>


    <!-- ================================= -->
    <!-- CORNER DETAILS -->
    <!-- ================================= -->

    <g
      fill="none"
      stroke="#58A6FF"
      stroke-opacity=".25"
      stroke-width="1">


      <path d="M40 70 H110"/>
      <path d="M40 70 V125"/>


      <path d="M1490 70 H1560"/>
      <path d="M1560 70 V125"/>


      <path d="M40 430 H110"/>
      <path d="M40 375 V430"/>


      <path d="M1490 430 H1560"/>
      <path d="M1560 375 V430"/>

    </g>


    <!-- ================================= -->
    <!-- BOTTOM ENERGY BEAM -->
    <!-- ================================= -->

    <rect
      x="-200"
      y="470"
      width="200"
      height="1"
      fill="url(#neon)"
      opacity=".7">

      <animate
        attributeName="x"
        values="-200;1600"
        dur="5s"
        repeatCount="indefinite"/>

    </rect>


  </g>

</svg>
