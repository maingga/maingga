<!-- ===================================================== -->
<!-- ANIMATED TERMINAL TEXT -->
<!-- ===================================================== -->

<defs>

  <!-- BUILD -->
  <clipPath id="typeBuild">
    <rect
      x="60"
      y="125"
      width="0"
      height="32"
    >
      <animate
        attributeName="width"
        values="0;430;430;0"
        keyTimes="0;0.35;0.72;1"
        dur="6s"
        repeatCount="indefinite"
      />
    </rect>
  </clipPath>


  <!-- SOLVE -->
  <clipPath id="typeSolve">
    <rect
      x="60"
      y="168"
      width="0"
      height="32"
