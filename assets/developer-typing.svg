<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310">
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0D1117"/><stop offset="1" stop-color="#07152B"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" x2="1">
    <stop stop-color="#1F6FEB"/><stop offset=".5" stop-color="#58A6FF"/><stop offset="1" stop-color="#79C0FF"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#58A6FF" stroke-opacity=".045"/>
  </pattern>
  <clipPath id="clip"><rect x="0" y="0" width="1200" height="310" rx="24"/></clipPath>
</defs>

<g clip-path="url(#clip)">
<rect width="1200" height="310" fill="url(#panel)"/>
<rect width="1200" height="310" fill="url(#grid)"/>

<!-- subtle moving scan -->
<rect x="-100" y="0" width="80" height="310" fill="#58A6FF" opacity=".035">
  <animate attributeName="x" values="-100;1250" dur="6s" repeatCount="indefinite"/>
</rect>

<!-- top HUD bar -->
<rect x="0" y="0" width="1200" height="48" fill="#161B22" opacity=".75"/>
<circle cx="27" cy="24" r="6" fill="#FF5F56"/>
<circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
<circle cx="69" cy="24" r="6" fill="#27C93F"/>
<text x="100" y="29" fill="#8B949E" font-family="monospace" font-size="13">maingga.dev // developer-console</text>
<text x="1150" y="29" text-anchor="end" fill="#27C93F" font-family="monospace" font-size="12">● ONLINE</text>

<!-- terminal prompt -->
<g font-family="monospace">
  <text x="62" y="93" fill="#58A6FF" font-size="16">root@maingga</text>
  <text x="198" y="93" fill="#8B949E" font-size="16">:</text>
  <text x="211" y="93" fill="#79C0FF" font-size="16">~/profile</text>
  <text x="300" y="93" fill="#8B949E" font-size="16">$</text>
  <text x="322" y="93" fill="#FFFFFF" font-size="16">whoami</text>
</g>

<!-- typing lines, staggered with long pauses to create terminal typing illusion -->
<g font-family="monospace" font-size="23">
  <text x="62" y="140" fill="#FFFFFF">
    <tspan fill="#58A6FF">&gt;</tspan>
    <tspan dx="10">Full-Stack Developer</tspan>
    <tspan fill="#58A6FF">_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.08;.18;.43;.50;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="62" y="178" fill="#FFFFFF">
    <tspan fill="#58A6FF">&gt;</tspan>
    <tspan dx="10">Backend Engineer</tspan>
    <tspan fill="#58A6FF">_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.43;.51;.68;.75;1" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="62" y="216" fill="#FFFFFF">
    <tspan fill="#58A6FF">&gt;</tspan>
    <tspan dx="10">Mobile Developer</tspan>
    <tspan fill="#58A6FF">_</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.68;.76;.93;1;1" dur="10s" repeatCount="indefinite"/>
  </text>
</g>

<!-- right-side telemetry -->
<g font-family="monospace" font-size="12">
  <text x="850" y="105" fill="#484F58">RUNTIME</text>
  <text x="1110" y="105" text-anchor="end" fill="#58A6FF">ACTIVE</text>
  <rect x="850" y="117" width="260" height="5" rx="2.5" fill="#21262D"/>
  <rect x="850" y="117" width="220" height="5" rx="2.5" fill="url(#blue)">
    <animate attributeName="width" values="180;245;210;235;180" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="850" y="155" fill="#484F58">BUILD</text>
  <text x="1110" y="155" text-anchor="end" fill="#27C93F">READY</text>
  <rect x="850" y="167" width="260" height="5" rx="2.5" fill="#21262D"/>
  <rect x="850" y="167" width="245" height="5" rx="2.5" fill="#27C93F">
    <animate attributeName="width" values="210;250;225;245;210" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="850" y="205" fill="#484F58">LEARNING</text>
  <text x="1110" y="205" text-anchor="end" fill="#79C0FF">CONTINUOUS</text>
</g>

<!-- command line -->
<text x="62" y="270" fill="#8B949E" font-family="monospace" font-size="13">
  <tspan fill="#27C93F">✓</tspan>
  <tspan dx="8">system initialized</tspan>
  <tspan dx="16" fill="#58A6FF">•</tspan>
  <tspan dx="8">build</tspan>
  <tspan fill="#58A6FF">→</tspan>
  <tspan> test </tspan>
  <tspan fill="#58A6FF">→</tspan>
  <tspan> deploy </tspan>
  <tspan fill="#58A6FF">→</tspan>
  <tspan> improve</tspan>
</text>

<!-- blinking cursor -->
<rect x="62" y="284" width="10" height="16" fill="#58A6FF" filter="url(#glow)">
  <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</g>
</svg>