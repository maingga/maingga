      <animate
        attributeName="width"
        values="0;390;390;0"
        keyTimes="0;0.35;0.72;1"
        dur="6s"
        begin="1.8s"
        repeatCount="indefinite"
      />
    </rect>
  </clipPath>


  <!-- SHIP -->
  <clipPath id="typeShip">
