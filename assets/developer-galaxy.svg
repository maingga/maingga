<svg width="1200" height="650" viewBox="0 0 1200 650" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="75%">
    <stop offset="0%" stop-color="#161B22"/>
    <stop offset="65%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#05080c"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>

<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<ellipse cx="610" cy="325" rx="440" ry="210" fill="#1F6FEB" opacity=".07" filter="url(#soft)"/>

<!-- constellation lines -->
<g stroke="#58A6FF" stroke-opacity=".35" stroke-width="2" fill="none">
  <path d="M175 165 L330 250 L510 150 L690 230 L865 145 L1040 220"/>
  <path d="M330 250 L450 410 L650 455 L865 370 L1040 220"/>
  <path d="M510 150 L650 455"/>
  <path d="M690 230 L865 370"/>
</g>

<!-- stars -->
<g fill="#B9DCFF" filter="url(#glow)">
  <circle cx="175" cy="165" r="4"/><circle cx="330" cy="250" r="5"/>
  <circle cx="510" cy="150" r="4"/><circle cx="690" cy="230" r="5"/>
  <circle cx="865" cy="145" r="4"/><circle cx="1040" cy="220" r="4"/>
  <circle cx="450" cy="410" r="4"/><circle cx="650" cy="455" r="5"/>
  <circle cx="865" cy="370" r="4"/>
</g>

<!-- featured stars -->
<g filter="url(#glow)">
  <circle cx="330" cy="250" r="12" fill="#58A6FF" opacity=".25"/>
  <circle cx="330" cy="250" r="7" fill="#FFFFFF"/>
  <circle cx="650" cy="455" r="13" fill="#58A6FF" opacity=".25"/>
  <circle cx="650" cy="455" r="8" fill="#FFFFFF"/>
  <circle cx="865" cy="370" r="11" fill="#58A6FF" opacity=".25"/>
  <circle cx="865" cy="370" r="7" fill="#FFFFFF"/>
</g>

<!-- decorative stars -->
<g fill="#58A6FF" opacity=".8">
  <circle cx="95" cy="90" r="2"/><circle cx="250" cy="420" r="2"/><circle cx="395" cy="100" r="2"/>
  <circle cx="575" cy="535" r="2"/><circle cx="760" cy="95" r="2"/><circle cx="1110" cy="330" r="2"/>
  <circle cx="970" cy="520" r="2"/><circle cx="1100" cy="110" r="2"/>
</g>

<!-- title -->
