  <text x="600" y="58" fill="#FFFFFF" font-size="28" font-weight="700">DEVELOPER GALAXY</text>
  <text x="600" y="87" fill="#8B949E" font-size="14">A constellation of technologies, projects, and things I'm building.</text>
</g>

