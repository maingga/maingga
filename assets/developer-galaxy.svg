<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
<defs>
  <radialGradient id="bg" cx="50%" cy="48%" r="75%">
    <stop offset="0" stop-color="#111827"/>
    <stop offset=".55" stop-color="#0D1117"/>
    <stop offset="1" stop-color="#03060a"/>
  </radialGradient>
  <radialGradient id="nebula">
    <stop offset="0" stop-color="#1F6FEB" stop-opacity=".24"/>
    <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1200" height="680" rx="30" fill="url(#bg)"/>
<ellipse cx="600" cy="340" rx="470" ry="250" fill="url(#nebula)" filter="url(#blur)">
  <animate attributeName="rx" values="440;500;440" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="ry" values="230;270;230" dur="7s" repeatCount="indefinite"/>
</ellipse>

<!-- background stars -->
<g fill="#8B949E">
  <circle cx="70" cy="90" r="2"/><circle cx="150" cy="560" r="2"/><circle cx="240" cy="120" r="1.5"/>
  <circle cx="350" cy="610" r="2"/><circle cx="450" cy="90" r="1.5"/><circle cx="560" cy="580" r="2"/>
  <circle cx="720" cy="90" r="2"/><circle cx="820" cy="590" r="1.5"/><circle cx="940" cy="110" r="2"/>
  <circle cx="1080" cy="530" r="2"/><circle cx="1130" cy="180" r="1.5"/>
</g>

<!-- constellation -->
<g fill="none" stroke="#58A6FF" stroke-opacity=".32" stroke-width="2">
  <path d="M150 210 L340 300 L520 180 L700 290 L900 190 L1060 310"/>
  <path d="M340 300 L450 470 L650 530 L820 410 L1060 310"/>
  <path d="M520 180 L650 530"/>
  <path d="M700 290 L820 410"/>
</g>

<!-- orbit -->
<ellipse cx="650" cy="360" rx="290" ry="150" fill="none" stroke="#58A6FF" stroke-opacity=".12" stroke-dasharray="5 12">
  <animateTransform attributeName="transform" type="rotate" from="0 650 360" to="360 650 360" dur="30s" repeatCount="indefinite"/>
</ellipse>

<!-- nodes -->
<g filter="url(#glow)">
  <g fill="#B9DCFF">
    <circle cx="150" cy="210" r="4"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="180" r="5"><animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="290" r="5"><animate attributeName="r" values="4;7;4" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="190" r="4"><animate attributeName="r" values="3;6;3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#FFFFFF">
    <circle cx="340" cy="300" r="8"><animate attributeName="r" values="7;11;7" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="530" r="9"><animate attributeName="r" values="8;12;8" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="410" r="8"><animate attributeName="r" values="7;11;7" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- labels -->
<g font-family="Arial, Helvetica, sans-serif">
  <g transform="translate(340 318)">
    <rect x="-125" y="0" width="250" height="62" rx="14" fill="#0D1117" stroke="#1F6FEB" stroke-opacity=".7"/>
    <text x="0" y="25" fill="#FFF" text-anchor="middle" font-size="16" font-weight="700">🕌 ZIS CROWDFUNDING</text>
    <text x="0" y="47" fill="#8B949E" text-anchor="middle" font-size="12">Laravel • MySQL • Midtrans • QRIS</text>
  </g>
  <g transform="translate(650 548)">
    <rect x="-135" y="0" width="270" height="62" rx="14" fill="#0D1117" stroke="#1F6FEB" stroke-opacity=".7"/>
    <text x="0" y="25" fill="#FFF" text-anchor="middle" font-size="16" font-weight="700">🏸 SPORT CENTER</text>
    <text x="0" y="47" fill="#8B949E" text-anchor="middle" font-size="12">Next.js • React • Laravel • MySQL</text>
  </g>
  <g transform="translate(820 428)">
    <rect x="-125" y="0" width="250" height="62" rx="14" fill="#0D1117" stroke="#1F6FEB" stroke-opacity=".7"/>
    <text x="0" y="25" fill="#FFF" text-anchor="middle" font-size="16" font-weight="700">🌱 SMART IoT</text>
    <text x="0" y="47" fill="#8B949E" text-anchor="middle" font-size="12">ESP32 • Arduino • Firebase</text>
  </g>
  <text x="150" y="190" fill="#58A6FF" font-size="13">Frontend</text>
  <text x="500" y="160" fill="#58A6FF" font-size="13">Backend</text>
  <text x="690" y="270" fill="#58A6FF" font-size="13">Cloud</text>
  <text x="890" y="170" fill="#58A6FF" font-size="13">Mobile</text>
  <text x="1010" y="300" fill="#58A6FF" font-size="13">DevOps</text>
</g>

<text x="600" y="55" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">🌌 DEVELOPER GALAXY</text>
<text x="600" y="82" text-anchor="middle" fill="#8B949E" font-family="Arial, Helvetica, sans-serif" font-size="14">Projects become stars. Technologies become connections.</text>
</svg>
