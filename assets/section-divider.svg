<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 40"
     width="100%"
     height="40"
     role="img"
     aria-label="Developer section divider">

  <defs>

    <linearGradient id="line"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>

    </linearGradient>

    <linearGradient id="beam"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>

    </linearGradient>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="3"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <clipPath id="clip">
      <rect width="1200" height="40"/>
    </clipPath>

  </defs>


  <!-- ===================================== -->
  <!-- BASE CIRCUIT -->
  <!-- ===================================== -->

  <path
    d="M0 20
       H470
       L488 14
       L512 26
       L530 20
       H670
       L688 14
       L712 26
       L730 20
       H1200"
    fill="none"
    stroke="#21262D"
    stroke-width="1"/>


  <!-- ===================================== -->
  <!-- MAIN LINE -->
  <!-- ===================================== -->

  <path
    d="M0 20
       H470
       L488 14
       L512 26
       L530 20
       H670
       L688 14
       L712 26
       L730 20
       H1200"
    fill="none"
    stroke="url(#line)"
    stroke-width="1.5"/>


  <!-- ===================================== -->
  <!-- MOVING LIGHT BEAM -->
  <!-- ===================================== -->

  <g clip-path="url(#clip)">

    <rect
      x="-160"
      y="8"
      width="160"
      height="24"
      fill="url(#beam)"
      opacity=".8"
      filter="url(#glow)">

      <animate
        attributeName="x"
        from="-160"
        to="1200"
        dur="3.5s"
        repeatCount="indefinite"/>

    </rect>


    <!-- SECOND BEAM -->

    <rect
      x="-220"
      y="12"
      width="100"
      height="16"
      fill="url(#beam)"
      opacity=".35">

      <animate
        attributeName="x"
        from="-220"
        to="1200"
        dur="5s"
        begin="1.5s"
        repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ===================================== -->
  <!-- NODE 01 -->
  <!-- ===================================== -->

  <circle
    cx="512"
    cy="20"
    r="3"
    fill="#58A6FF"
    filter="url(#glow)">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="1;.35;1"
      dur="1.5s"
      repeatCount="indefinite"/>

  </circle>


  <!-- NODE 01 RING -->

  <circle
    cx="512"
    cy="20"
    r="5"
    fill="none"
    stroke="#58A6FF"
    stroke-width="1"
    opacity=".5">

    <animate
      attributeName="r"
      values="5;13;5"
      dur="2s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values=".5;0;.5"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ===================================== -->
  <!-- NODE 02 -->
  <!-- ===================================== -->

  <circle
    cx="688"
    cy="20"
    r="3"
    fill="#58A6FF"
    filter="url(#glow)">

    <animate
      attributeName="r"
      values="3;6;3"
      dur="1.5s"
      begin=".75s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values=".3;1;.3"
      dur="1.5s"
      begin=".75s"
      repeatCount="indefinite"/>

  </circle>


  <!-- NODE 02 RING -->

  <circle
    cx="688"
    cy="20"
    r="5"
    fill="none"
    stroke="#58A6FF"
    stroke-width="1"
    opacity=".5">

    <animate
      attributeName="r"
      values="5;13;5"
      dur="2s"
      begin=".75s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values=".5;0;.5"
      dur="2s"
      begin=".75s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ===================================== -->
  <!-- MOVING DATA PARTICLES -->
  <!-- ===================================== -->

  <circle
    cy="20"
    r="2"
    fill="#FFFFFF"
    filter="url(#glow)">

    <animate
      attributeName="cx"
      values="0;300;470;512;670;688;850;1200"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cy="20"
    r="1.5"
    fill="#79C0FF">

    <animate
      attributeName="cx"
      values="0;300;470;512;670;688;850;1200"
      dur="4s"
      begin="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ===================================== -->
  <!-- MICRO PARTICLES -->
  <!-- ===================================== -->

  <circle cx="320" cy="20" r="1" fill="#58A6FF">

    <animate
      attributeName="opacity"
      values=".1;1;.1"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="850" cy="20" r="1" fill="#58A6FF">

    <animate
      attributeName="opacity"
      values="1;.1;1"
      dur="2.7s"
      repeatCount="indefinite"/>

  </circle>


  <circle cx="1010" cy="20" r="1" fill="#58A6FF">

    <animate
      attributeName="opacity"
      values=".1;1;.1"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>


  <!-- ===================================== -->
  <!-- CENTRAL PULSE -->
  <!-- ===================================== -->

  <path
    d="M450 20
       H470
       L488 14
       L512 26
       L530 20"
    fill="none"
    stroke="#58A6FF"
    stroke-width="2"
    filter="url(#glow)"
    opacity=".2">

    <animate
      attributeName="opacity"
      values=".1;.9;.1"
      dur="2s"
      repeatCount="indefinite"/>

  </path>


  <path
    d="M650 20
       H670
       L688 14
       L712 26
       L730 20"
    fill="none"
    stroke="#58A6FF"
    stroke-width="2"
    filter="url(#glow)"
    opacity=".2">

    <animate
      attributeName="opacity"
      values=".9;.1;.9"
      dur="2s"
      repeatCount="indefinite"/>

  </path>

</svg>
