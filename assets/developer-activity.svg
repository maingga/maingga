      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
