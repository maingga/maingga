<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="320"
  viewBox="0 0 1200 320"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Developer Activity Dashboard</title>
  <desc id="desc">
    Ahmad Nana Maingga GitHub developer activity visualization.
  </desc>

  <defs>
    <!-- Main blue gradient -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#58A6FF"/>
    </linearGradient>

    <!-- Background grid -->
    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#58A6FF"
        stroke-opacity=".045"
      />
    </pattern>

    <!-- Soft glow -->
    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip container -->
    <clipPath id="containerClip">
      <rect
        x="5"
        y="5"
        width="1190"
        height="310"
        rx="22"
      />
    </clipPath>
  </defs>

  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect
    x="5"
    y="5"
    width="1190"
    height="310"
    rx="22"
    fill="#0D1117"
    stroke="#30363D"
  />

