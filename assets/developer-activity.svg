  <!-- Background -->
  <rect
    x="5"
    y="5"
    width="1190"
    height="290"
    rx="20"
    fill="#0D1117"
    stroke="#30363D"
  />

  <rect
    x="5"
    y="5"
    width="1190"
    height="290"
    rx="20"
    fill="url(#grid)"
  />

