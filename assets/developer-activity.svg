      ◈ DEVELOPER ACTIVITY // MAINGGA
    </text>

    <!-- blinking online -->
    <text
      x="1160"
      y="43"
      text-anchor="end"
      fill="#27C93F"
      font-size="11"
    >
      ● PUBLIC DATA

      <animate
        attributeName="opacity"
        values="1;0.35;1"
        dur="2s"
        repeatCount="indefinite"
      />
    </text>


    <!-- Header line -->

    <line
      x1="40"
      y1="61"
      x2="1160"
      y2="61"
      stroke="#21262D"
    />

    <!-- Moving blue signal -->

    <rect
      x="40"
      y="60"
      width="120"
      height="2"
      fill="url(#blueGradient)"
      filter="url(#glow)"
    >
      <animate
        attributeName="x"
        values="40;1040;40"
        dur="6s"
        repeatCount="indefinite"
      />
    </rect>


