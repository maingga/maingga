<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="320"
  viewBox="0 0 1200 320"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>

    <!-- ========================================================= -->
    <!-- GRADIENTS -->
    <!-- ========================================================= -->

    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB">
        <animate
          attributeName="stop-color"
          values="#1F6FEB;#58A6FF;#1F6FEB"
          dur="4s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#58A6FF">
        <animate
          attributeName="stop-color"
          values="#58A6FF;#79C0FF;#58A6FF"
          dur="4s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <linearGradient
      id="scanGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>

    <!-- ========================================================= -->
    <!-- GRID -->
    <!-- ========================================================= -->

    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#58A6FF"
        stroke-opacity="0.045"
      />
    </pattern>

    <!-- ========================================================= -->
    <!-- GLOW -->
    <!-- ========================================================= -->

    <filter
      id="glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- =========================================================== -->
  <!-- MAIN CONTAINER -->
  <!-- =========================================================== -->

  <rect
    x="5"
    y="5"
    width="1190"
    height="310"
    rx="22"
    fill="#0D1117"
    stroke="#30363D"
  />

  <!-- Animated grid -->
  <rect
    x="5"
    y="5"
    width="1190"
    height="310"
    rx="22"
    fill="url(#grid)"
  />


  <!-- =========================================================== -->
  <!-- MOVING SCAN LINE -->
  <!-- =========================================================== -->

  <rect
    x="-300"
    y="5"
    width="260"
    height="310"
    fill="url(#scanGradient)"
    opacity="0.10"
  >
    <animate
      attributeName="x"
      from="-300"
      to="1240"
      dur="7s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- =========================================================== -->
  <!-- CONTENT -->
  <!-- =========================================================== -->

  <g
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
