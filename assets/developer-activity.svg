      <rect x="162" y="0" width="17" height="17" rx="3" fill="#006D32"/>
      <rect x="184" y="0" width="17" height="17" rx="3" fill="#26A641"/>
      <rect x="206" y="0" width="17" height="17" rx="3" fill="#39D353"/>

