<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 700"
     width="100%"
     height="auto"
     role="img"
     aria-label="Ahmad Nana Maingga - Digital Builder">

  <defs>

    <!-- ============================= -->
    <!-- BACKGROUND -->
    <!-- ============================= -->

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%"
            stop-color="#02040A"/>

      <stop offset="50%"
            stop-color="#0B1018"/>

      <stop offset="100%"
            stop-color="#071A32"/>

    </linearGradient>


    <!-- ============================= -->
    <!-- BLUE GLOW -->
    <!-- ============================= -->

    <radialGradient id="centerGlow">

      <stop offset="0%"
            stop-color="#1F6FEB"
            stop-opacity=".28"/>

      <stop offset="45%"
            stop-color="#1F6FEB"
            stop-opacity=".10"/>

      <stop offset="100%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ============================= -->
    <!-- GRID -->
    <!-- ============================= -->

    <pattern id="grid"
             width="50"
             height="50"
             patternUnits="userSpaceOnUse">

      <path
        d="M50 0H0V50"
        fill="none"
        stroke="#58A6FF"
        stroke-opacity=".045"
        stroke-width="1"/>

    </pattern>


    <!-- ============================= -->
    <!-- LINE GRADIENT -->
    <!-- ============================= -->

    <linearGradient id="blueLine"
                    x1="0"
                    x2="1">

      <stop offset="0%"
            stop-color="#58A6FF"
            stop-opacity="0"/>

      <stop offset="50%"
            stop-color="#58A6FF"
            stop-opacity=".9"/>

      <stop offset="100%"
            stop-color="#58A6FF"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ============================= -->
    <!-- GLOW FILTER -->
    <!-- ============================= -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="6"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>

        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- ============================= -->
    <!-- SOFT FILTER -->
    <!-- ============================= -->

    <filter id="soft"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">

      <feGaussianBlur
        stdDeviation="35"/>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1600"
    height="700"
    rx="32"
    fill="url(#bg)"/>


  <!-- GRID -->

  <rect
    width="1600"
    height="700"
    rx="32"
    fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- CENTER GLOW -->
  <!-- ================================================= -->

  <ellipse
    cx="800"
    cy="340"
    rx="650"
    ry="330"
    fill="url(#centerGlow)"
    filter="url(#soft)">

    <animate
      attributeName="opacity"
      values=".65;1;.65"
      dur="6s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ================================================= -->
  <!-- SCAN LINE -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="-10"
    width="1600"
    height="2"
    fill="url(#blueLine)"
    opacity=".65">

    <animate
      attributeName="y"
      values="-10;710;-10"
      dur="6s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- DECORATIVE PARTICLES -->
  <!-- ================================================= -->

  <g
    fill="#B9DCFF"
    filter="url(#glow)">

    <circle
      cx="130"
      cy="150"
      r="3">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.4s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="220"
      cy="530"
      r="2">

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="3.2s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="390"
      cy="105"
      r="2">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.7s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="1210"
      cy="110"
      r="3">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.3s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="1380"
      cy="520"
      r="2">

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="3.4s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="1480"
      cy="170"
      r="3">

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.8s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- LEFT CONSTELLATION -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".20"
    stroke-width="2">

    <path
      d="M90 270 L250 190 L390 275"/>

    <path
      d="M250 190 L300 105"/>

  </g>


  <g fill="#58A6FF"
     opacity=".65">

    <circle cx="90" cy="270" r="3"/>
    <circle cx="250" cy="190" r="3"/>
    <circle cx="390" cy="275" r="3"/>
    <circle cx="300" cy="105" r="2"/>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT CONSTELLATION -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".20"
    stroke-width="2">

    <path
      d="M1210 275 L1350 190 L1510 270"/>

    <path
      d="M1350 190 L1300 105"/>

  </g>


  <g fill="#58A6FF"
     opacity=".65">

    <circle cx="1210" cy="275" r="3"/>
    <circle cx="1350" cy="190" r="3"/>
    <circle cx="1510" cy="270" r="3"/>
    <circle cx="1300" cy="105" r="2"/>

  </g>


  <!-- ================================================= -->
  <!-- TOP SYSTEM STATUS -->
  <!-- ================================================= -->

  <g
    font-family="Arial, Helvetica, sans-serif"
    text-anchor="middle">

    <text
      x="800"
      y="170"
      fill="#58A6FF"
      font-size="16"
      font-weight="600"
      letter-spacing="4">

      DIGITAL BUILDER // SYSTEM ONLINE

    </text>


    <!-- ================================================= -->
    <!-- MAIN NAME -->
    <!-- ================================================= -->

    <text
      x="800"
      y="270"
      fill="#FFFFFF"
      font-size="58"
      font-weight="800"
      letter-spacing="1">

      AHMAD NANA MAINGGA

    </text>


    <!-- ================================================= -->
    <!-- ROLE -->
    <!-- ================================================= -->

    <text
      x="800"
      y="320"
      fill="#A5ADB8"
      font-size="18"
      letter-spacing="2">

      FULL-STACK DEVELOPER • MOBILE • CLOUD • IoT

    </text>

  </g>


  <!-- ================================================= -->
  <!-- DIVIDER -->
  <!-- ================================================= -->

  <line
    x1="500"
    y1="355"
    x2="1100"
    y2="355"
    stroke="url(#blueLine)"
    stroke-width="1"/>


  <!-- ================================================= -->
  <!-- STATUS CARDS -->
  <!-- ================================================= -->

  <g
    font-family="monospace"
    font-size="14">

    <!-- BUILDING -->

    <g transform="translate(430 395)">

      <rect
        width="220"
        height="52"
        rx="26"
        fill="#0D1117"
        stroke="#30363D"
        stroke-width="1.5"/>

      <circle
        cx="32"
        cy="26"
        r="6"
        fill="#27C93F">

        <animate
          attributeName="opacity"
          values="1;.25;1"
          dur="1.5s"
          repeatCount="indefinite"/>

      </circle>

      <text
        x="52"
        y="31"
        fill="#D0D7DE">

        BUILDING

      </text>

    </g>


    <!-- LEARNING -->

    <g transform="translate(690 395)">

      <rect
        width="220"
        height="52"
        rx="26"
        fill="#0D1117"
        stroke="#30363D"
        stroke-width="1.5"/>

      <circle
        cx="32"
        cy="26"
        r="6"
        fill="#58A6FF">

        <animate
          attributeName="opacity"
          values=".3;1;.3"
          dur="1.8s"
          repeatCount="indefinite"/>

      </circle>

      <text
        x="52"
        y="31"
        fill="#D0D7DE">

        LEARNING

      </text>

    </g>


    <!-- IMPROVING -->

    <g transform="translate(950 395)">

      <rect
        width="220"
        height="52"
        rx="26"
        fill="#0D1117"
        stroke="#30363D"
        stroke-width="1.5"/>

      <circle
        cx="32"
        cy="26"
        r="6"
        fill="#FFFFFF">

        <animate
          attributeName="opacity"
          values=".3;1;.3"
          dur="2.1s"
          repeatCount="indefinite"/>

      </circle>

      <text
        x="52"
        y="31"
        fill="#D0D7DE">

        IMPROVING

      </text>

    </g>

  </g>


  <!-- ================================================= -->
  <!-- TECH STACK -->
  <!-- ================================================= -->

  <text
    x="800"
    y="510"
    text-anchor="middle"
    fill="#58A6FF"
    opacity=".80"
    font-family="monospace"
    font-size="13"
    letter-spacing="1">

    ◈ WEB  ◈  API  ◈  DATABASE  ◈  MOBILE  ◈  CLOUD  ◈  IoT  ◈

  </text>


  <!-- ================================================= -->
  <!-- BOTTOM MESSAGE -->
  <!-- ================================================= -->

  <text
    x="800"
    y="565"
    text-anchor="middle"
    fill="#8B949E"
    font-family="monospace"
    font-size="13"
    letter-spacing="2">

    BUILD • LEARN • SHIP • IMPROVE

  </text>


  <!-- ================================================= -->
  <!-- BOTTOM LINE -->
  <!-- ================================================= -->

  <line
    x1="470"
    y1="595"
    x2="1130"
    y2="595"
    stroke="url(#blueLine)"
    stroke-width="1"
    opacity=".7"/>


  <!-- ================================================= -->
  <!-- CORNER DECORATION -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".25"
    stroke-width="1">

    <!-- top left -->

    <path d="M40 80 H125"/>
    <path d="M40 80 V145"/>

    <!-- top right -->

    <path d="M1475 80 H1560"/>
    <path d="M1560 80 V145"/>

    <!-- bottom left -->

    <path d="M40 620 H125"/>
    <path d="M40 555 V620"/>

    <!-- bottom right -->

    <path d="M1475 620 H1560"/>
    <path d="M1560 555 V620"/>

  </g>


  <!-- ================================================= -->
  <!-- SMALL TECH MARKERS -->
  <!-- ================================================= -->

  <g
    font-family="monospace"
    font-size="9"
    fill="#58A6FF"
    opacity=".45">

    <text x="70" y="175">SYS_01</text>
    <text x="70" y="190">ONLINE</text>

    <text x="1440" y="175">NODE_01</text>
    <text x="1440" y="190">ACTIVE</text>

  </g>


</svg>
