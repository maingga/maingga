<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#02040A"/><stop offset=".48" stop-color="#0D1117"/><stop offset="1" stop-color="#07152B"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#58A6FF" stop-opacity=".9"/>
    <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#58A6FF" stroke-opacity=".055"/>
  </pattern>
</defs>
<rect width="1600" height="520" rx="32" fill="url(#bg)"/>
<rect width="1600" height="520" rx="32" fill="url(#grid)"/>

<ellipse cx="800" cy="250" rx="560" ry="210" fill="#1F6FEB" opacity=".12" filter="url(#soft)">
  <animate attributeName="opacity" values=".08;.16;.08" dur="6s" repeatCount="indefinite"/>
</ellipse>

<!-- scan line -->
<rect x="0" y="-30" width="1600" height="2" fill="url(#line)" opacity=".7">
  <animate attributeName="y" values="-30;550;-30" dur="5.5s" repeatCount="indefinite"/>
</rect>

<!-- stars / particles -->
<g fill="#B9DCFF" filter="url(#glow)">
  <circle cx="130" cy="100" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="350" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="410" cy="90" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1190" cy="110" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1360" cy="350" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="1480" cy="150" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
</g>

<!-- floating constellation lines -->
<g fill="none" stroke="#58A6FF" stroke-opacity=".22" stroke-width="2">
 <path d="M120 210L300 150L430 250"/>
 <path d="M1170 250L1310 150L1490 220"/>
</g>

<!-- title -->
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <text x="800" y="190" fill="#58A6FF" font-size="15" letter-spacing="6">DIGITAL BUILDER // SYSTEM ONLINE</text>
  <text x="800" y="255" fill="#FFFFFF" font-size="52" font-weight="800" letter-spacing="2">AHMAD NANA MAINGGA</text>
  <text x="800" y="295" fill="#8B949E" font-size="17" letter-spacing="3">FULL-STACK • MOBILE • BACKEND • CLOUD • IoT</text>
</g>

<!-- status chips -->
<g font-family="monospace" font-size="13">
  <g transform="translate(490 350)">
    <rect width="170" height="42" rx="21" fill="#0D1117" stroke="#30363D"/>
    <circle cx="25" cy="21" r="6" fill="#27C93F"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="42" y="26" fill="#C9D1D9">BUILDING</text>
  </g>
  <g transform="translate(715 350)">
    <rect width="170" height="42" rx="21" fill="#0D1117" stroke="#30363D"/>
    <circle cx="25" cy="21" r="6" fill="#58A6FF"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="42" y="26" fill="#C9D1D9">LEARNING</text>
  </g>
  <g transform="translate(940 350)">
    <rect width="170" height="42" rx="21" fill="#0D1117" stroke="#30363D"/>
    <circle cx="25" cy="21" r="6" fill="#FFFFFF"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" repeatCount="indefinite"/></circle>
    <text x="42" y="26" fill="#C9D1D9">IMPROVING</text>
  </g>
</g>

<text x="800" y="455" text-anchor="middle" fill="#58A6FF" opacity=".75" font-family="monospace" font-size="12">◈ WEB  ◈ API  ◈ DATABASE  ◈ MOBILE  ◈ CLOUD  ◈ IoT  ◈</text>
</svg>