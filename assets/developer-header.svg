<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 700"
     width="100%"
     height="auto"
     role="img"
     aria-label="Ahmad Nana Maingga - Digital Builder">

  <defs>

    <!-- ================================================= -->
    <!-- BACKGROUND -->
    <!-- ================================================= -->

    <linearGradient id="bg"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">

      <stop offset="0%" stop-color="#02040A"/>
      <stop offset="48%" stop-color="#0A1019"/>
      <stop offset="100%" stop-color="#071A32"/>

    </linearGradient>


    <!-- ================================================= -->
    <!-- BLUE -->
    <!-- ================================================= -->

    <linearGradient id="blue"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#79C0FF"/>

    </linearGradient>


    <!-- ================================================= -->
    <!-- ENERGY LINE -->
    <!-- ================================================= -->

    <linearGradient id="energy"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0%"
            stop-color="#58A6FF"
            stop-opacity="0"/>

      <stop offset="40%"
            stop-color="#58A6FF"
            stop-opacity=".1"/>

      <stop offset="50%"
            stop-color="#FFFFFF"
            stop-opacity="1"/>

      <stop offset="60%"
            stop-color="#58A6FF"
            stop-opacity=".1"/>

      <stop offset="100%"
            stop-color="#58A6FF"
            stop-opacity="0"/>

    </linearGradient>


    <!-- ================================================= -->
    <!-- CENTER LIGHT -->
    <!-- ================================================= -->

    <radialGradient id="centerGlow">

      <stop offset="0%"
            stop-color="#1F6FEB"
            stop-opacity=".22"/>

      <stop offset="45%"
            stop-color="#1F6FEB"
            stop-opacity=".08"/>

      <stop offset="100%"
            stop-color="#1F6FEB"
            stop-opacity="0"/>

    </radialGradient>


    <!-- ================================================= -->
    <!-- GRID -->
    <!-- ================================================= -->

    <pattern id="grid"
             width="50"
             height="50"
             patternUnits="userSpaceOnUse">

      <path
        d="M50 0H0V50"
        fill="none"
        stroke="#58A6FF"
        stroke-opacity=".045"/>

    </pattern>


    <!-- ================================================= -->
    <!-- NAME REVEAL -->
    <!-- ================================================= -->

    <clipPath id="nameReveal">

      <rect
        x="250"
        y="215"
        width="0"
        height="75">

        <animate
          attributeName="width"
          values="0;1100;1100;0"
          keyTimes="0;0.28;0.72;1"
          dur="8s"
          repeatCount="indefinite"/>

      </rect>

    </clipPath>


    <!-- ================================================= -->
    <!-- SOFT GLOW -->
    <!-- ================================================= -->

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur
        stdDeviation="5"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect
    width="1600"
    height="700"
    rx="32"
    fill="url(#bg)"/>


  <rect
    width="1600"
    height="700"
    rx="32"
    fill="url(#grid)"/>


  <!-- ================================================= -->
  <!-- CENTER ATMOSPHERE -->
  <!-- ================================================= -->

  <ellipse
    cx="800"
    cy="340"
    rx="680"
    ry="330"
    fill="url(#centerGlow)">

    <animate
      attributeName="opacity"
      values=".5;1;.5"
      dur="6s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- ================================================= -->
  <!-- SCANNING BEAM -->
  <!-- ================================================= -->

  <rect
    x="0"
    y="-20"
    width="1600"
    height="3"
    fill="url(#energy)"
    opacity=".7">

    <animate
      attributeName="y"
      values="-20;720;-20"
      dur="7s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- SECOND SCAN -->
  <!-- ================================================= -->

  <rect
    x="-300"
    y="0"
    width="220"
    height="700"
    fill="#58A6FF"
    opacity=".018">

    <animate
      attributeName="x"
      values="-300;1650;-300"
      dur="11s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- TOP STATUS -->
  <!-- ================================================= -->

  <g font-family="monospace">

    <text
      x="800"
      y="135"
      text-anchor="middle"
      fill="#58A6FF"
      font-size="15"
      letter-spacing="5">

      DIGITAL BUILDER

    </text>


    <text
      x="800"
      y="160"
      text-anchor="middle"
      fill="#484F58"
      font-size="10"
      letter-spacing="3">

      SYSTEM / ONLINE / READY

    </text>


    <!-- Status pulse -->

    <circle
      cx="635"
      cy="154"
      r="3"
      fill="#27C93F">

      <animate
        attributeName="r"
        values="3;7;3"
        dur="1.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="1;.1;1"
        dur="1.5s"
        repeatCount="indefinite"/>

    </circle>


    <circle
      cx="965"
      cy="154"
      r="3"
      fill="#27C93F">

      <animate
        attributeName="r"
        values="3;7;3"
        dur="1.5s"
        begin=".7s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="1;.1;1"
        dur="1.5s"
        begin=".7s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- NAME BASE -->
  <!-- ================================================= -->

  <text
    x="800"
    y="270"
    text-anchor="middle"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="800"
    letter-spacing="2"
    opacity=".08">

    AHMAD NANA MAINGGA

  </text>


  <!-- ================================================= -->
  <!-- ANIMATED NAME -->
  <!-- ================================================= -->

  <g clip-path="url(#nameReveal)">

    <text
      x="800"
      y="270"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="Arial, Helvetica, sans-serif"
      font-size="58"
      font-weight="800"
      letter-spacing="2">

      AHMAD NANA MAINGGA

    </text>

  </g>


  <!-- ================================================= -->
  <!-- NAME SCANNER -->
  <!-- ================================================= -->

  <rect
    x="250"
    y="218"
    width="3"
    height="62"
    fill="#58A6FF"
    filter="url(#glow)">

    <animate
      attributeName="x"
      values="250;1350;250"
      dur="8s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- ROLE -->
  <!-- ================================================= -->

  <text
    x="800"
    y="320"
    text-anchor="middle"
    fill="#A5ADB8"
    font-family="monospace"
    font-size="17"
    letter-spacing="2">

    FULL-STACK DEVELOPER • MOBILE • CLOUD • IoT

    <animate
      attributeName="opacity"
      values="0;.3;1;1;0"
      keyTimes="0;.12;.25;.75;1"
      dur="8s"
      repeatCount="indefinite"/>

  </text>


  <!-- ================================================= -->
  <!-- ENERGY DIVIDER -->
  <!-- ================================================= -->

  <line
    x1="450"
    y1="355"
    x2="1150"
    y2="355"
    stroke="#21262D"
    stroke-width="1"/>


  <rect
    x="450"
    y="353"
    width="90"
    height="4"
    fill="url(#energy)"
    filter="url(#glow)">

    <animate
      attributeName="x"
      values="450;1060;450"
      dur="4s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- STATUS CARDS -->
  <!-- ================================================= -->

  <g font-family="monospace">

    <!-- BUILDING -->

    <g transform="translate(430 395)">

      <rect
        width="220"
        height="52"
        rx="26"
        fill="#0D1117"
        stroke="#30363D"/>


      <circle
        cx="32"
        cy="26"
        r="5"
        fill="#27C93F">

        <animate
          attributeName="r"
          values="5;9;5"
          dur="1.5s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values="1;.15;1"
          dur="1.5s"
          repeatCount="indefinite"/>

      </circle>


      <text
        x="52"
        y="31"
        fill="#D0D7DE"
        font-size="13">

        BUILDING

      </text>

    </g>


    <!-- LEARNING -->

    <g transform="translate(690 395)">

      <rect
        width="220"
        height="52"
        rx="26"
        fill="#0D1117"
        stroke="#30363D"/>


      <circle
        cx="32"
        cy="26"
        r="5"
        fill="#58A6FF">

        <animate
          attributeName="r"
          values="5;9;5"
          dur="1.8s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values=".2;1;.2"
          dur="1.8s"
          repeatCount="indefinite"/>

      </circle>


      <text
        x="52"
        y="31"
        fill="#D0D7DE"
        font-size="13">

        LEARNING

      </text>

    </g>


    <!-- IMPROVING -->

    <g transform="translate(950 395)">

      <rect
        width="220"
        height="52"
        rx="26"
        fill="#0D1117"
        stroke="#30363D"/>


      <circle
        cx="32"
        cy="26"
        r="5"
        fill="#FFFFFF">

        <animate
          attributeName="r"
          values="5;9;5"
          dur="2.1s"
          repeatCount="indefinite"/>

        <animate
          attributeName="opacity"
          values=".2;1;.2"
          dur="2.1s"
          repeatCount="indefinite"/>

      </circle>


      <text
        x="52"
        y="31"
        fill="#D0D7DE"
        font-size="13">

        IMPROVING

      </text>

    </g>

  </g>


  <!-- ================================================= -->
  <!-- TECH LINE -->
  <!-- ================================================= -->

  <text
    x="800"
    y="510"
    text-anchor="middle"
    fill="#58A6FF"
    font-family="monospace"
    font-size="13"
    letter-spacing="2">

    WEB  ◈  API  ◈  DATABASE  ◈  MOBILE  ◈  CLOUD  ◈  IoT

    <animate
      attributeName="opacity"
      values=".45;1;.45"
      dur="3s"
      repeatCount="indefinite"/>

  </text>


  <!-- ================================================= -->
  <!-- TERMINAL MESSAGE -->
  <!-- ================================================= -->

  <text
    x="800"
    y="560"
    text-anchor="middle"
    fill="#8B949E"
    font-family="monospace"
    font-size="13"
    letter-spacing="2">

    &gt; BUILD • LEARN • SHIP • IMPROVE

  </text>


  <!-- ================================================= -->
  <!-- MOVING TERMINAL CURSOR -->
  <!-- ================================================= -->

  <rect
    x="800"
    y="545"
    width="7"
    height="17"
    fill="#58A6FF">

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur=".8s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- LOWER ENERGY LINE -->
  <!-- ================================================= -->

  <line
    x1="470"
    y1="595"
    x2="1130"
    y2="595"
    stroke="#21262D"/>


  <rect
    x="470"
    y="593"
    width="100"
    height="3"
    fill="url(#energy)">

    <animate
      attributeName="x"
      values="470;1030;470"
      dur="4.5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ================================================= -->
  <!-- LEFT CONSTELLATION -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".22">

    <path d="M90 270 L250 190 L390 275"/>
    <path d="M250 190 L300 105"/>

  </g>


  <g fill="#58A6FF">

    <circle cx="90" cy="270" r="3">

      <animate
        attributeName="r"
        values="3;7;3"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="250" cy="190" r="3">

      <animate
        attributeName="r"
        values="3;8;3"
        dur="2.8s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="390" cy="275" r="3"/>

    <circle cx="300" cy="105" r="2"/>

  </g>


  <!-- ================================================= -->
  <!-- RIGHT CONSTELLATION -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".22">

    <path d="M1210 275 L1350 190 L1510 270"/>
    <path d="M1350 190 L1300 105"/>

  </g>


  <g fill="#58A6FF">

    <circle cx="1210" cy="275" r="3"/>

    <circle cx="1350" cy="190" r="3">

      <animate
        attributeName="r"
        values="3;8;3"
        dur="2.8s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="1510" cy="270" r="3">

      <animate
        attributeName="r"
        values="3;7;3"
        dur="2.5s"
        repeatCount="indefinite"/>

    </circle>

    <circle cx="1300" cy="105" r="2"/>

  </g>


  <!-- ================================================= -->
  <!-- FLOATING PARTICLES -->
  <!-- ================================================= -->

  <g fill="#B9DCFF">

    <circle cx="130" cy="150" r="2">

      <animate
        attributeName="cy"
        values="150;125;150"
        dur="4s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.4s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="220" cy="530" r="2">

      <animate
        attributeName="cy"
        values="530;500;530"
        dur="5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values="1;.2;1"
        dur="3.2s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="1380" cy="520" r="2">

      <animate
        attributeName="cy"
        values="520;490;520"
        dur="4.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.8s"
        repeatCount="indefinite"/>

    </circle>


    <circle cx="1480" cy="170" r="2">

      <animate
        attributeName="cy"
        values="170;145;170"
        dur="3.5s"
        repeatCount="indefinite"/>

      <animate
        attributeName="opacity"
        values=".2;1;.2"
        dur="2.2s"
        repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- CORNER HUD -->
  <!-- ================================================= -->

  <g
    fill="none"
    stroke="#58A6FF"
    stroke-opacity=".25">

    <path d="M40 80 H125"/>
    <path d="M40 80 V145"/>

    <path d="M1475 80 H1560"/>
    <path d="M1560 80 V145"/>

    <path d="M40 620 H125"/>
    <path d="M40 555 V620"/>

    <path d="M1475 620 H1560"/>
    <path d="M1560 555 V620"/>

  </g>


  <!-- ================================================= -->
  <!-- SYSTEM LABELS -->
  <!-- ================================================= -->

  <g
    font-family="monospace"
    font-size="9"
    fill="#58A6FF"
    opacity=".45">

    <text x="70" y="175">
      SYS_01
    </text>

    <text x="70" y="190">
      ONLINE
    </text>

    <text x="1440" y="175">
      NODE_01
    </text>

    <text x="1440" y="190">
      ACTIVE
    </text>

  </g>


  <!-- ================================================= -->
  <!-- BOTTOM SYSTEM -->
  <!-- ================================================= -->

  <text
    x="800"
    y="635"
    text-anchor="middle"
    fill="#484F58"
    font-family="monospace"
    font-size="10"
    letter-spacing="3">

    SYSTEM // BUILD // TEST // DEPLOY // IMPROVE

  </text>


</svg>
